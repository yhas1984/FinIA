      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#50fa7b"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#50fa7b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#10131A"/>
  <g fill="none" stroke="#bd93f9" stroke-width="2" opacity="0.55">
    <path d="M0 90 L120 90 L140 70 L320 70 L340 90 L512 90"/>
    <path d="M0 150 L80 150 L100 130 L280 130 L300 150 L512 150"/>
    <path d="M0 210 L140 210 L160 190 L320 190 L340 210 L512 210"/>
    <path d="M0 270 L60 270 L80 250 L260 250 L280 270 L512 270"/>
    <path d="M0 330 L100 330 L120 310 L300 310 L320 330 L512 330"/>
    <path d="M0 390 L120 390 L140 370 L340 370 L360 390 L512 390"/>
    <path d="M0 450 L80 450 L100 430 L280 430 L300 450 L512 450"/>
  </g>
  <g fill="#bd93f9" opacity="0.7">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="100" cy="130" r="3"/>
    <circle cx="160" cy="190" r="3"/>
    <circle cx="80" cy="250" r="3"/>
    <circle cx="120" cy="310" r="3"/>
    <circle cx="140" cy="370" r="3"/>
    <circle cx="100" cy="430" r="3"/>
  </g>
  <g fill="#50fa7b" opacity="0.7">
    <circle cx="320" cy="70" r="3"/>
    <circle cx="280" cy="130" r="3"/>
    <circle cx="320" cy="190" r="3"/>
    <circle cx="260" cy="250" r="3"/>
    <circle cx="300" cy="310" r="3"/>
    <circle cx="340" cy="370" r="3"/>
