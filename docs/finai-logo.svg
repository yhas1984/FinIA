<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Logo de FinAI</title>
  <desc id="desc">Candado con letra M y la marca FinAI, en gradiente violeta a verde sobre fondo oscuro con circuitos.</desc>
  <defs>
