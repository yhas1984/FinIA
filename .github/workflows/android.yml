name: Android CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - codex/**
  pull_request:

# Un solo run por rama: evita el duplicado push + pull_request
# (el run anterior de la misma rama se cancela automáticamente).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --max-workers=2 -Dorg.gradle.parallel=false

      - name: Run lint
        run: ./gradlew :app:lintDebug --max-workers=2 -Dorg.gradle.parallel=false

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --max-workers=2 -Dorg.gradle.parallel=false

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html

  recovery-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated storage and recovery regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            CLASSES="com.gastos.di.BankImportStorageTest,com.gastos.di.WalletCaptureRecoveryTest,com.gastos.di.MovementListProjectionTest,com.gastos.di.OrganizationStorageTest,com.gastos.di.CommandOperationDatabaseTest,com.gastos.di.RemoteSyncOutboxMigrationTest,com.gastos.di.TaxMigrationTest,com.gastos.di.BankPerformanceTest,com.gastos.di.DocumentCaptureDatabaseTest,com.gastos.di.AutomationIntegrationTest,com.gastos.di.DocumentViewerUiTest,com.gastos.di.BankImportUiTest,com.gastos.di.FinancialReportTest,com.gastos.di.DeviceLargeBackupTest,com.gastos.di.EssentialUiTest,com.gastos.di.ManualCompactUiTest"
            run_suite() {
              ./gradlew :app:connectedDebugAndroidTest --max-workers=2 -Dorg.gradle.parallel=false -Pandroid.testInstrumentationRunnerArguments.largeBackup=true -Pandroid.testInstrumentationRunnerArguments.class="$1"
            }
            if run_suite "$CLASSES"; then exit 0; fi
            # Un reintento (solo las clases fallidas) para los flakes conocidos del emulador.
            retry=$(python3 - <<'PY'
            import glob, xml.etree.ElementTree as ET
            failed = set()
            for path in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
                try:
                    root = ET.parse(path).getroot()
                except Exception:
                    continue
                for case in root.iter('testcase'):
                    if case.find('failure') is not None or case.find('error') is not None:
                        failed.add(case.get('classname'))
            print(','.join(sorted(f for f in failed if f)))
            PY
            )
            echo "Reintento de clases fallidas: $retry"
            if [ -z "$retry" ]; then exit 1; fi
            run_suite "$retry"
      - name: Preserve instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-regressions
          path: app/build/reports/androidTests/
