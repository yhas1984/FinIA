name: Android CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - codex/**
  pull_request:

# Un solo run por rama: evita el duplicado push + pull_request
# (el run anterior de la misma rama se cancela automáticamente).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --max-workers=2 -Dorg.gradle.parallel=false

      - name: Run lint
        run: ./gradlew :app:lintDebug --max-workers=2 -Dorg.gradle.parallel=false

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --max-workers=2 -Dorg.gradle.parallel=false

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html

  recovery-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated storage and recovery regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # 16-oct-2026: el emulador por defecto se degradaba («bad color buffer handle») y tumbaba los
          # tests de UI. Se fuerza render por software (estable), sin instantáneas y con más memoria.
          # 17-oct-2026: se desactiva Vulkan (otra fuente conocida de esos errores de framebuffer con
          # SwiftShader) y se apagan las cámaras, que no hacen falta y consumen recursos gráficos.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -camera-back none -camera-front none -feature -Vulkan
          emulator-boot-timeout: 1200
          script: bash scripts/ci-recovery-regressions.sh
      - name: Preserve instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-regressions
          path: app/build/reports/androidTests/
